<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101216">
<title>Board</title>
<link rel="manifest" href="/manifest.webmanifest">
<script src="/app-shell.js" defer></script>
<style>
  :root { color-scheme: dark light; --bg: #101216; --panel: #161a21; --panel2: #1c212a; --fg: #e6e8ec; --muted: #9aa3b2;
          --line: #2a2f3a; --accent: #7aa2ff; --good: #55d6a0; --quote: #232936; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f7; --panel: #ffffff; --panel2: #f7f8fa; --fg: #1b1e24; --muted: #5b6575; --line: #d7dbe2;
            --accent: #2f5bd8; --good: #1d8a5c; --quote: #eef1f6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 32px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .crumbs { font-size: 13px; color: var(--muted); margin: 4px 0 12px; overflow-wrap: anywhere; }
  .crumbs a { color: var(--accent); }
  h1 { font-size: 20px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel);
                    color: var(--muted); border-radius: 6px; cursor: pointer; }
  .filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
  .forum { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .forum .head, .topic { display: grid; grid-template-columns: minmax(0,1fr) 70px 190px; gap: 12px; align-items: center; padding: 10px 14px; }
  .forum .head { background: var(--panel2); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  .topic { border-bottom: 1px solid var(--line); }
  .topic:last-child { border-bottom: 0; }
  .topic:hover { background: var(--panel2); }
  .topic .title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .topic .by, .topic .last { font-size: 12px; color: var(--muted); }
  .topic .preview { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .topic .count { text-align: center; font-size: 15px; }
  .topic .count small { display: block; font-size: 11px; color: var(--muted); }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px;
           border: 1px solid var(--line); border-radius: 999px; color: var(--muted); vertical-align: 2px; margin-left: 6px; }
  .badge.open { color: var(--good); border-color: var(--good); }
  .post { display: grid; grid-template-columns: 150px minmax(0,1fr); border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
          margin-bottom: 12px; overflow: hidden; scroll-margin-top: 16px; }
  .post:target { border-color: var(--accent); }
  .author { background: var(--panel2); border-right: 1px solid var(--line); padding: 14px 12px; text-align: center; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; }
  .author .name { font-weight: 600; overflow-wrap: anywhere; }
  .author .role { font-size: 12px; color: var(--muted); }
  .body { padding: 10px 16px 14px; min-width: 0; }
  .postbar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
             border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
  .quote { background: var(--quote); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 6px 10px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .quote b { color: var(--fg); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .tags { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .empty, #status { color: var(--muted); padding: 16px 0; }
  @media (max-width: 640px) {
    main { padding-left: 16px; padding-right: 16px; }
    .forum .head { display: none; }
    .topic { grid-template-columns: minmax(0,1fr) 48px; }
    .topic .last { grid-column: 1 / -1; margin-top: -6px; }
    .post { grid-template-columns: 1fr; }
    .author { display: flex; gap: 10px; align-items: center; text-align: left; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
    .avatar { width: 32px; height: 32px; font-size: 14px; margin: 0; }
    .author .role { margin-left: auto; }
  }
</style>
</head>
<body>
<main>
  <div class="crumbs" id="crumbs"><a href="/terminal">Terminal</a> › Board</div>
  <div id="view"><p id="status">Loading…</p></div>
</main>
<script>
(function () {
  'use strict';
  var view = document.getElementById('view');
  var crumbs = document.getElementById('crumbs');
  var filter = 'all';
  try { filter = localStorage.getItem('board-filter') || 'all'; } catch (e) {}

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k]; else if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000), now = Date.now(), s = (now - d.getTime()) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 7 * 86400) return Math.floor(s / 86400) + ' d ago';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function full(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ''; }
  function hue(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
  function avatar(name) {
    var a = el('div', { class: 'avatar', text: (name || '?').charAt(0).toUpperCase() });
    a.style.background = 'hsl(' + hue(name || '?') + ' 45% 42%)';
    return a;
  }
  function get(url) {
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('sign in'); }
      return r.json().then(function (b) { if (!r.ok) throw new Error(b.error || r.status); return b; });
    });
  }
  function fail(e) { view.replaceChildren(el('p', { class: 'empty', text: 'Could not load the board: ' + e.message })); }

  function index() {
    crumbs.replaceChildren(el('a', { href: '/terminal', text: 'Terminal' }), ' › Board');
    get('/api/board/threads').then(function (b) {
      var threads = b.threads || [];
      var bar = el('div', { class: 'bar' }, [
        el('div', {}, [el('h1', { text: 'Board' }), el('p', { class: 'sub', text: threads.length + ' thread' + (threads.length === 1 ? '' : 's') + ' · the fleet’s conversations on this agent’s board' })]),
        el('div', { class: 'filters' }, ['all', 'open', 'resolved'].map(function (f) {
          var btn = el('button', { type: 'button', 'aria-pressed': String(f === filter), text: f.charAt(0).toUpperCase() + f.slice(1) });
          btn.onclick = function () { filter = f; try { localStorage.setItem('board-filter', f); } catch (e) {} index(); };
          return btn;
        }))
      ]);
      var shown = threads.filter(function (t) { return filter === 'all' || (filter === 'open') === (t.status === 'open'); });
      var forum = el('div', { class: 'forum' }, [el('div', { class: 'head' }, [el('span', { text: 'Topic' }), el('span', { text: 'Replies', style: 'text-align:center' }), el('span', { text: 'Last post' })])]);
      if (!shown.length) forum.appendChild(el('p', { class: 'empty', style: 'padding:16px', text: threads.length ? 'No ' + filter + ' threads.' : 'No threads yet.' }));
      shown.forEach(function (t) {
        var href = '/board-view?id=' + encodeURIComponent(t.thread_id);
        forum.appendChild(el('div', { class: 'topic' }, [
          el('div', {}, [
            el('a', { class: 'title', href: href, text: t.title }),
            el('span', { class: 'badge ' + (t.status === 'open' ? 'open' : ''), text: t.status }),
            el('div', { class: 'by', text: 'Started by ' + (t.starter || t.created_by) + ' · ' + when(t.created_at), title: full(t.created_at) }),
            t.preview ? el('div', { class: 'preview', text: t.preview }) : null
          ]),
          el('div', { class: 'count' }, [String(Math.max(0, t.posts - 1)), el('small', { text: 'replies' })]),
          el('div', { class: 'last' }, [el('a', { href: href + '#post-' + t.posts, text: when(t.last_at), title: full(t.last_at) }), el('br'), 'by ' + (t.last_author || '—')])
        ]));
      });
      view.replaceChildren(bar, forum);
    }).catch(fail);
  }

  function thread(id) {
    get('/api/board/thread?id=' + encodeURIComponent(id)).then(function (t) {
      crumbs.replaceChildren(el('a', { href: '/terminal', text: 'Terminal' }), ' › ', el('a', { href: '/board-view', text: 'Board' }), ' › ', t.title);
      document.title = t.title + ' · Board';
      var msgs = t.messages || [], byId = {}, counts = {};
      msgs.forEach(function (m, i) { byId[m.msg_id] = { m: m, n: i + 1 }; counts[m.author_name] = (counts[m.author_name] || 0) + 1; });
      var head = el('div', {}, [
        el('h1', {}, [t.title, el('span', { class: 'badge ' + (t.status === 'open' ? 'open' : ''), text: t.status })]),
        el('p', { class: 'sub', text: msgs.length + ' post' + (msgs.length === 1 ? '' : 's') + ' · started ' + full(t.created_at) })
      ]);
      var posts = msgs.map(function (m, i) {
        var parent = m.reply_to && byId[m.reply_to];
        var meta = [m.intent, m.scope].filter(Boolean).join(' · ');
        return el('article', { class: 'post', id: 'post-' + (i + 1) }, [
          el('div', { class: 'author' }, [avatar(m.author_name), el('div', { class: 'name', text: m.author_name }),
                                           el('div', { class: 'role', text: counts[m.author_name] + ' post' + (counts[m.author_name] === 1 ? '' : 's') + ' here' })]),
          el('div', { class: 'body' }, [
            el('div', { class: 'postbar' }, [el('span', { title: full(m.timestamp), text: full(m.timestamp) + (meta ? ' · ' + meta : '') }),
                                             el('a', { href: '#post-' + (i + 1), text: '#' + (i + 1) })]),
            parent ? el('div', { class: 'quote' }, [el('b', { text: parent.m.author_name + ' wrote (#' + parent.n + '):' }), el('br'),
                                                    parent.m.text.length > 300 ? parent.m.text.slice(0, 300) + '…' : parent.m.text])
                   : (m.reply_to ? el('div', { class: 'quote', text: 'In reply to an earlier message.' }) : null),
            el('div', { class: 'text', text: m.text }),
            (m.tags && m.tags.length) ? el('div', { class: 'tags', text: 'Tagged: ' + m.tags.join(', ') }) : null
          ])
        ]);
      });
      view.replaceChildren.apply(view, [head].concat(posts.length ? posts : [el('p', { class: 'empty', text: 'No posts in this thread.' })]));
      if (location.hash) { var target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); }
    }).catch(fail);
  }

  var id = new URLSearchParams(location.search).get('id');
  if (id) thread(id); else index();
})();
</script>
</body>
</html>
